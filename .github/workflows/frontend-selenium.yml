# Run one frontend Selenium test on every push (fast smoke check)
name: Frontend Selenium (tcid67)

on:
  push:
    branches: [main, 'ci/**', 'feature/*']

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Chrome version
        run: |
          google-chrome --version
          chromedriver --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run frontend test (tcid67 – verify heading)
        env:
          BROWSER: headlesschrome
          RESULTS_DIR: ./results
          ENV: test
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          mkdir -p results
          pytest ssqatest/tests -m tcid67 -v --html=results/report.html --self-contained-html

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-html-report
          path: results/report.html
          retention-days: 30

  deploy-report:
    needs: frontend-test
    if: always() && needs.frontend-test.result != 'cancelled'
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Download HTML report
        uses: actions/download-artifact@v4
        with:
          name: pytest-html-report

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          # Rename report.html to index.html so it loads as the homepage
          cp report.html _site/index.html

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Output Deployment Link
        run: |
          echo "### 🚀 Test Report Live at: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY